name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly-disclosed CVE in a pinned dependency surfaces even
    # when nobody is pushing to the repo.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    # The scraper's SQL is PostgreSQL-specific, so the database tests run
    # against a real server rather than a stand-in.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Test
        env:
          SCRAPER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Scan pinned dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t nivel-arena-scraper:ci -f Containerfile .

      - name: Verify entrypoints start
        run: |
          docker run --rm nivel-arena-scraper:ci python main.py --help
          docker run --rm nivel-arena-scraper:ci python -c "import convert_to_png"
