services:
  scraper:
    build:
      context: .
      dockerfile: Containerfile
    userns_mode: keep-id

    # This process feeds untrusted, plaintext-HTTP content into OpenCV's native
    # image decoders, so the container is locked down to the bare minimum.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # Writable scratch for anything outside the mounted data directories.
      - /tmp:size=64m,mode=1777

    # Bound the blast radius of a decompression bomb or a runaway retry loop.
    mem_limit: 2g
    pids_limit: 256

    # Holds SCRAPER_DATABASE_URL. `make setup` seeds it from .env.example;
    # the credentials never belong in this file or in argv.
    env_file:
      - .env

    environment:
      SCRAPER_DOWNLOADS_DIR: /app/downloads
      SCRAPER_PROCESSED_DIR: /app/processed

    volumes:
      # :Z relabels for SELinux; keep-id maps the host UID under rootless Podman.
      - ./downloads:/app/downloads:Z
      - ./processed:/app/processed:Z

    networks:
      - nivel

networks:
  # PostgreSQL lives in the nivel-arena-collection-tracker stack; joining its
  # network is what makes the `nivel-db` hostname resolve. Start it there first
  # (`make up` in that repo) -- this compose file does not own the database.
  nivel:
    external: true
    name: nivel-arena-collection-tracker_default
