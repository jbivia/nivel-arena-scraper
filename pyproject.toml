[project]
name = "nivel-arena-scraper"
version = "1.0.0"
description = "Scraper and image post-processor for NivelArena trading cards"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "S",    # bandit security rules
    "C4",   # comprehensions
    "SIM",  # simplifications
]
ignore = [
    "S101",  # assert is fine in tests
    "E501",  # long lines are handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally construct hostile inputs and touch private attributes.
# SIM300: `value == pytest.approx(x)` is the documented pytest form, not a Yoda condition.
"tests/*" = ["S105", "S106", "SLF001", "SIM300"]
